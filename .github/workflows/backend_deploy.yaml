name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            # Force success (|| true) because pnpm v10 often exits with 1 in CI
            pnpm install --no-frozen-lockfile --dangerously-allow-all-builds || true
            if [ -n "$use_worker_assets_with_telegram" ]; then
              pnpm build:telegram:pages
            else
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          
          # ✅ Force success to move past the pnpm v10 environment check
          pnpm install --no-frozen-lockfile --dangerously-allow-all-builds || true

          if [ -n "$use_mail_wasm_parser" ]; then
            pnpm add mail-parser-wasm-worker --dangerously-allow-all-builds || true
            git apply ../.github/config/mail-parser-wasm-worker.patch
          fi

          # ✅ Run the actual deployment. If this fails, it's a Cloudflare issue.
          echo "Starting Wrangler deployment..."
          pnpm run deploy
          
          echo "Deployed successfully for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}